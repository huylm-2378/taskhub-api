name: taskhub

x-app: &app-base
  build: .
  image: taskhub-api:local
  env_file: .env
  environment:
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    REDIS_URL: ${DOCKER_REDIS_URL:-}
    CELERY_BROKER_URL: ${DOCKER_CELERY_BROKER_URL:-redis://redis:6379/1}
    CELERY_RESULT_BACKEND: ${DOCKER_CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app-base
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  migrate:
    <<: *app-base
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  worker:
    <<: *app-base
    profiles: ["jobs"]
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=heavy", "--concurrency=2", "--hostname=heavy@%h"]
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker-maintenance:
    <<: *app-base
    profiles: ["jobs"]
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=maintenance", "--concurrency=1", "--hostname=maintenance@%h"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  beat:
    <<: *app-base
    profiles: ["jobs"]
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/var/lib/taskhub/beat/schedule"]
    volumes:
      - celery_beat:/var/lib/taskhub/beat
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: ["mail"]
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
  redis:
    image: redis:7-alpine
    profiles: ["cache", "jobs"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  redis_data:
  celery_beat:
